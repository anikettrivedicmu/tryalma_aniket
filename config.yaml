app:
  title: Lead Management System
  version: 1.0.0
  description: A scalable lead management system with FastAPI
  debug: false

server:
  host: 0.0.0.0
  port: 8000
  workers: 4
  reload: false
  cors_origins:
    - http://localhost:3000
    - https://yourdomain.com

database:
  url: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  pool_size: 5
  max_overflow: 10

redis:
  url: redis://${REDIS_HOST}:${REDIS_PORT}
  rate_limit:
    times: 100
    seconds: 60

security:
  jwt_secret: ${JWT_SECRET}
  jwt_algorithm: HS256
  access_token_expire_minutes: 30

email:
  smtp_host: ${SMTP_HOST}
  smtp_port: ${SMTP_PORT}
  smtp_user: ${SMTP_USER}
  smtp_password: ${SMTP_PASSWORD}
  from_email: ${FROM_EMAIL}
  attorney_email: ${ATTORNEY_EMAIL}

storage:
  upload_dir: uploads
  max_file_size: 10485760  # 10MB in bytes