version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - app/.env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
      - redis

  db:
    image: postgres:13
    ports:
      - "5432:5432"
    env_file:
      - app/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:6
    ports:
      - "6379:6379"

volumes:
  postgres_data: